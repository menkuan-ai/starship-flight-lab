name: Publish playable Starship site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site
        run: |
          curl --fail --location --retry 5 --retry-delay 10 --output site.zip https://github.com/menkuan-ai/starship-flight-lab/releases/download/windows-r13/Starship-Web-R13.zip
          echo 'ab900632f3d9e708c352c7d581ceeef19dc65dcbc601e0c7c96bbc7b91f8bfff  site.zip' | sha256sum --check
          unzip -q site.zip -d _site
          test -f _site/play/flight.html
          test "$(du -sb _site | cut -f1)" -lt 1000000000
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
