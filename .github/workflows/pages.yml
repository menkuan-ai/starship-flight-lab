name: Publish Starship download page
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prepare download page
        run: |
          mkdir -p _site
          for file in index.html style.css preview.webp; do
            curl --fail --location --retry 5 --retry-delay 10 --output "_site/$file" "https://raw.githubusercontent.com/menkuan-ai/starship-flight-lab/main/$file"
          done
          touch _site/.nojekyll
          test -f _site/index.html
          test ! -d _site/play
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
